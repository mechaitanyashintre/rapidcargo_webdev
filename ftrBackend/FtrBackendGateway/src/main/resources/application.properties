# FtrBackendGateway/src/main/resources/application.prop

# Port property
server.port=3000

# Eureka properties
spring.application.name=ftrbackendgateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Gateway routes using Zuul for UserMS
zuul.routes.userms1.path=/userprofile/**
zuul.routes.userms1.strip-prefix=false
zuul.routes.userms1.service-id=FTRBACKENDUSERMS

zuul.routes.userms2.path=/userprofile/*/**
zuul.routes.userms2.strip-prefix=false
zuul.routes.userms2.service-id=FTRBACKENDUSERMS

# Gateway routes using Zuul for TerminalMS
zuul.routes.terminalms1.path=/terminals/**
zuul.routes.terminalms1.strip-prefix=false
zuul.routes.terminalms1.service-id=FTRBACKENDTERMINALMS

zuul.routes.terminalms2.path=/terminals/*/**
zuul.routes.terminalms2.strip-prefix=false
zuul.routes.terminalms2.service-id=FTRBACKENDTERMINALMS

# Gateway routes using Zuul for VehicleMS
zuul.routes.vehiclems2.path=/vehicles/*/**
zuul.routes.vehiclems2.strip-prefix=false
zuul.routes.vehiclems2.service-id=FTRBACKENDVEHICLEMS

# Gateway routes using Zuul for WorkItemMS
zuul.routes.workitemms1.path=/workitems/**
zuul.routes.workitemms1.strip-prefix=false
zuul.routes.workitemms1.service-id=FTRBACKENDWORKITEMMS

zuul.routes.workitemms2.path=/workitems/*/**
zuul.routes.workitemms2.strip-prefix=false
zuul.routes.workitemms2.service-id=FTRBACKENDWORKITEMMS
