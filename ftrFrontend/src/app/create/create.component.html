<div class="container">
  <div class="card mt-5" style="align-items: center;">
    <h1>User Dashboard</h1>
  </div>

  <div class="card mt-5" style="padding: 20px;">
    <form #registerForm="ngForm" (ngSubmit)="register(registerForm)">
      <div class="form-group">
        <label for="name"> Name : </label>
        <input type="text" #name="ngModel" name="name" [(ngModel)]="name" class="form-control" placeholder="Item Name">
      </div>

      <div class="form-group">
        <label for="address">Type :</label>
        <input type="text" #address="ngModel" name="address" [(ngModel)]="address" class="form-control" placeholder="Item Type">
      </div>

      <div class="form-group">
        <label for="percentage"> Quantity :</label>
        <input type="number" #percentage="ngModel" name="percentage" [(ngModel)]="percentage" class="form-control" placeholder="Item Quantity">
      </div>

      <div class="form-group">
        <label for="from"> From : </label>
        <input type="number" #from="ngModel" name="from" [(ngModel)]="from" class="form-control" placeholder="From">
      </div>

      <div class="form-group">
        <label for="to"> To :</label>
        <input type="number" #to="ngModel" name="to" [(ngModel)]="to" class="form-control" placeholder="To">
      </div>

      <div class="form-group">
        <label for="location"> Location :</label>
        <input type="text" #location="ngModel" name="location" [(ngModel)]="location" class="form-control" placeholder="Location">
      </div>

      <div class="form-group">
        <input type="submit" value="submit" class="btn btn-primary w-100">
      </div>
    </form>
  </div>

  <div class="mt-5">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Roll number</th>
          <th>Name</th>
          <th>Address</th>
          <th>Percentage</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of studentDetails">
          <td>{{student.rollNumber}}</td>
          <td>{{student.name}}</td>
          <td>{{student.address}}</td>
          <td>{{student.percentage}}</td>
          <td><button type="button" class="btn btn-primary" (click)="edit(student)">Edit</button></td>
          <td><button type="button" class="btn btn-danger" (click)="deleteStudent(student)">Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Update Student</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form #updateForm="ngForm" (ngSubmit)="updateStudent()">
          <div class="form-group">
            <label for="rollNumber">Student Rollnumber :</label>
            <input type="text" disabled [(ngModel)]="studentToUpdate.rollNumber" name="rollNumber" id="rollNumber" class="form-control" placeholder="Student Roll number">
          </div>
          <div class="form-group">
            <label for="name">Student Name :</label>
            <input type="text" [(ngModel)]="studentToUpdate.name" name="name" id="name" class="form-control" placeholder="Student Name">
          </div>
          <div class="form-group">
            <label for="address">Student Address :</label>
            <input type="text" [(ngModel)]="studentToUpdate.address" name="address" id="address" class="form-control" placeholder="Student Address">
          </div>
          <div class="form-group">
            <label for="percentage">Student Percentage :</label>
            <input type="number" [(ngModel)]="studentToUpdate.percentage" name="percentage" id="percentage" class="form-control" placeholder="Student Percentage">
          </div>
          <div class="form-group">
            <input type="submit" value="Update" class="btn btn-primary w-100">
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
